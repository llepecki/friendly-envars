name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # global.json pins the SDK with rollForward disabled, so both patches must be installed exactly.
  DOTNET_SDK_VERSIONS: |
    8.0.424
    10.0.400

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Set Version Suffix
        id: version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "suffix=" >> $GITHUB_OUTPUT
          else
            echo "suffix=pr-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSIONS }}

      - name: Verify SDK selection
        run: |
          set -euo pipefail
          actual="$(dotnet --version)"
          if [[ "$actual" != "10.0.400" ]]; then
            echo "global.json must select SDK 10.0.400, got $actual" >&2
            exit 1
          fi
          dotnet --list-sdks

      - name: Restore
        run: dotnet restore FriendlyEnvars.slnx

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:VersionSuffix="${{ steps.version.outputs.suffix }}" FriendlyEnvars.slnx

      - name: Test (net8.0)
        run: dotnet test tests/FriendlyEnvars.Tests/FriendlyEnvars.Tests.csproj --no-restore --no-build --configuration Release --framework net8.0 --logger trx --results-directory TestResults

      - name: Test (net10.0)
        run: dotnet test tests/FriendlyEnvars.Tests/FriendlyEnvars.Tests.csproj --no-restore --no-build --configuration Release --framework net10.0 --logger trx --results-directory TestResults

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Pack NuGet Package
        run: dotnet pack --no-build --configuration Release -p:VersionSuffix="${{ steps.version.outputs.suffix }}" src/FriendlyEnvars/FriendlyEnvars.csproj

      - name: Extract Package Version
        id: extract-version
        run: |
          PACKAGE_PATH=$(ls src/FriendlyEnvars/bin/Release/*.nupkg | head -1)
          PACKAGE_VERSION=$(basename "$PACKAGE_PATH" .nupkg | sed 's/FriendlyEnvars\.//')
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $PACKAGE_VERSION"

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: friendly-envars-${{ steps.extract-version.outputs.version }}
          path: src/FriendlyEnvars/bin/Release/*.nupkg

      - name: Publish NuGet Package
        if: github.ref == 'refs/heads/master'
        run: dotnet nuget push src/FriendlyEnvars/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  portability:
    name: Portability (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        framework: [ net8.0, net10.0 ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSIONS }}

      - name: Restore
        run: dotnet restore FriendlyEnvars.slnx

      - name: Build
        run: dotnet build --no-restore --configuration Release FriendlyEnvars.slnx

      - name: Portability tests
        run: dotnet test tests/FriendlyEnvars.Tests/FriendlyEnvars.Tests.csproj --no-restore --no-build --configuration Release --framework ${{ matrix.framework }} --filter 'Category=Portability'
