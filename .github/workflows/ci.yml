name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

env:
  # global.json pins the SDK with rollForward disabled, so both patches must be installed exactly.
  DOTNET_SDK_VERSIONS: |
    8.0.424
    10.0.400

jobs:
  validate:
    name: Validate (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        framework: [ net8.0, net10.0 ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # eng/secret-scan.sh scans the full history across all refs.
          fetch-depth: 0

      - name: Secret scan
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: eng/secret-scan.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSIONS }}

      - name: Verify SDK selection
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(dotnet --version)"
          if [[ "$actual" != "10.0.400" ]]; then
            echo "global.json must select SDK 10.0.400, got $actual" >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore FriendlyEnvars.slnx --locked-mode

      - name: Validate workflows
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: eng/validate-workflows.sh

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: dotnet format FriendlyEnvars.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build FriendlyEnvars.slnx --no-restore --configuration Release --warnaserror

      - name: Full tests
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test tests/FriendlyEnvars.Tests/FriendlyEnvars.Tests.csproj --no-restore --no-build --configuration Release --framework ${{ matrix.framework }}

      - name: Portability tests
        run: dotnet test tests/FriendlyEnvars.Tests/FriendlyEnvars.Tests.csproj --no-restore --no-build --configuration Release --framework ${{ matrix.framework }} --filter "Category=Portability"

      - name: Run sample
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: eng/run-sample.sh

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: eng/audit-dependencies.sh

      - name: Validation pack
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: dotnet pack src/FriendlyEnvars/FriendlyEnvars.csproj --no-build --no-restore --configuration Release --output validation-pack

      - name: Verify package
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: eng/verify-package.sh validation-pack/FriendlyEnvars.2.0.0.nupkg validation-pack/FriendlyEnvars.2.0.0.snupkg

      - name: Verify documentation
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: eng/verify-docs.sh validation-pack/FriendlyEnvars.2.0.0.nupkg

      - name: Verify API removals
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: eng/verify-api-removals.sh

      - name: Quick Start smoke consumer
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: eng/smoke-consumer.sh validation-pack/FriendlyEnvars.2.0.0.nupkg

      - name: Trim smoke
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: eng/trim-smoke.sh

  report-tests:
    name: Report tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSIONS }}

      - name: Restore
        run: dotnet restore FriendlyEnvars.slnx --locked-mode

      - name: Build
        run: dotnet build FriendlyEnvars.slnx --no-restore --configuration Release

      - name: Test (net8.0)
        run: dotnet test tests/FriendlyEnvars.Tests/FriendlyEnvars.Tests.csproj --no-restore --no-build --configuration Release --framework net8.0 --logger trx --results-directory TestResults

      - name: Test (net10.0)
        run: dotnet test tests/FriendlyEnvars.Tests/FriendlyEnvars.Tests.csproj --no-restore --no-build --configuration Release --framework net10.0 --logger trx --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@7b7927aa7da8b82e81e755810cb51f39941a2cc7 # v2.2.0
        if: always()
        with:
          name: Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx

  package:
    name: Package
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSIONS }}

      - name: Restore
        run: dotnet restore FriendlyEnvars.slnx --locked-mode

      - name: Build
        run: dotnet build FriendlyEnvars.slnx --no-restore --configuration Release --warnaserror

      - name: Pack
        run: dotnet pack src/FriendlyEnvars/FriendlyEnvars.csproj --no-build --no-restore --configuration Release --output artifacts/release

      - name: Restore tools
        run: dotnet tool restore --configfile NuGet.config

      - name: Generate SBOM
        run: eng/generate-sbom.sh artifacts/release

      - name: Verify SBOM
        run: eng/verify-sbom.sh artifacts/release/sbom.spdx.json

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts/release
          shasum -a 256 FriendlyEnvars.2.0.0.nupkg FriendlyEnvars.2.0.0.snupkg sbom.spdx.json | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Attest nupkg provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/release/FriendlyEnvars.2.0.0.nupkg

      - name: Attest snupkg provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/release/FriendlyEnvars.2.0.0.snupkg

      - name: Attest nupkg SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/release/FriendlyEnvars.2.0.0.nupkg
          sbom-path: artifacts/release/sbom.spdx.json

      - name: Attest snupkg SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/release/FriendlyEnvars.2.0.0.snupkg
          sbom-path: artifacts/release/sbom.spdx.json

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: friendly-envars-2.0.0-${{ github.sha }}
          path: |
            artifacts/release/FriendlyEnvars.2.0.0.nupkg
            artifacts/release/FriendlyEnvars.2.0.0.snupkg
            artifacts/release/sbom.spdx.json
            artifacts/release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: package
    runs-on: ubuntu-latest
    environment: nuget-production
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSIONS }}

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: friendly-envars-2.0.0-${{ github.sha }}
          path: artifacts/release

      - name: Build repository verifier
        run: |
          set -euo pipefail
          dotnet restore eng/FriendlyEnvars.RepositoryVerifier/FriendlyEnvars.RepositoryVerifier.csproj --locked-mode
          dotnet build eng/FriendlyEnvars.RepositoryVerifier/FriendlyEnvars.RepositoryVerifier.csproj --configuration Release --no-restore

      - name: Verify checksums and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts/release
          shasum -a 256 --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          VERIFY_DIR="$(mktemp -d)"
          for artifact in FriendlyEnvars.2.0.0.nupkg FriendlyEnvars.2.0.0.snupkg; do
            gh attestation verify "artifacts/release/$artifact" \
              --repo llepecki/friendly-envars \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow llepecki/friendly-envars/.github/workflows/ci.yml \
              --source-ref refs/heads/master \
              --source-digest "${{ github.sha }}" \
              --format json > "$VERIFY_DIR/$artifact.provenance.json"
            gh attestation verify "artifacts/release/$artifact" \
              --repo llepecki/friendly-envars \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --signer-workflow llepecki/friendly-envars/.github/workflows/ci.yml \
              --source-ref refs/heads/master \
              --source-digest "${{ github.sha }}" \
              --format json > "$VERIFY_DIR/$artifact.sbom.json"
            dotnet eng/FriendlyEnvars.RepositoryVerifier/bin/Release/net10.0/FriendlyEnvars.RepositoryVerifier.dll attestation \
              --artifact "artifacts/release/$artifact" \
              --provenance "$VERIFY_DIR/$artifact.provenance.json" \
              --sbom-attestation "$VERIFY_DIR/$artifact.sbom.json" \
              --checksums artifacts/release/SHA256SUMS \
              --repository llepecki/friendly-envars \
              --source-ref refs/heads/master \
              --commit "${{ github.sha }}" \
              --signer-workflow llepecki/friendly-envars/.github/workflows/ci.yml
          done

      - name: NuGet login
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544 # v1.1.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        run: dotnet nuget push artifacts/release/FriendlyEnvars.2.0.0.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
